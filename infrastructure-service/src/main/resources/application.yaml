server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: infrastructure-service


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
## validate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true


  cloud:
    compatibility-verifier:
      enabled: true

    vault:
      enabled: true
      uri: ${BAO_ADDR}
      authentication: APPROLE

      app-role:
        role-id: ${BAO_ROLE_ID}
        secret-id: ${BAO_SECRET_ID}
        app-role-path: approle

      kv:
        enabled: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.platformcloud.infrastructure: INFO
